[tool.poetry]
name = "schedule-parser"
version = "0.1.3"
description = "Stankin Schedule PDF Parser"
authors = ["PROF-Development"]
readme = "README.md"
homepage = "https://github.com/PROF-Development/schedule-parser"
repository = "https://github.com/PROF-Development/schedule-parser.git"
packages = [
    { include = "schedule_parser" }
]

[tool.poetry.dependencies]
python = "^3.12"
pdfplumber = "^0.10.2"
pydantic = "^2.5.2"
anyio = "^4.7.0"
certifi = "^2024.8.30"


[tool.poetry.group.test.dependencies]
pytest = "^7.4.3"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.1"
gitlint = "^0.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
